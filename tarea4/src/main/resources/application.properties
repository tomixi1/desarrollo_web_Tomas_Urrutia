spring.application.name=tarea4
# --- Configuración del Servidor ---
server.port=8080

# --- Configuración de la Base de Datos ---

# URL de conexión a tu base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2
# Usuario de la base de datos
spring.datasource.username=cc5002
# Contraseña de la base de datos
spring.datasource.password=programacionweb
# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuración de JPA ---
# Le dice a Hibernate que detecte el dialecto de MySQL automáticamente
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=update
# Muestra las queries SQL que se ejecutan en la consola 
spring.jpa.show-sql=true

# --- Configuración de Thymeleaf (Motor de Plantillas) ---
spring.thymeleaf.mode=HTML5