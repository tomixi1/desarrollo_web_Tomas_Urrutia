<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Aviso de Adopción</title>
    <!-- Enlace a la hoja de CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🐾 Formulario de Adopción 🐾</h1>
    </header>

    <main>
        <!-- Se hace este'novalidate' para que el navegador no interfiera
             con nuestras validaciones de javascript. -->
        <form id="adoption-form" novalidate>
            
            <!-- SECCIÓN 1: DÓNDE -->
            <fieldset>
                <legend>¿Dónde se entrega la mascota?</legend>

                <div class="form-group">
                    <label for="region">Región:</label>
                    <select id="region" name="region">
                        <option value="">-- Seleccione una Región --</option>
                    </select>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" name="comuna">
                        <option value="">-- Seleccione una Comuna --</option>
                    </select>
                     <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="sector">Sector (opcional):</label>
                    <input type="text" id="sector" name="sector" maxlength="100" placeholder="Ej: Villa Los Libertadores">
                </div>
            </fieldset>

            <!-- SECCIÓN 2: CONTACTO -->
            <fieldset>
                <legend>¿Contacto de esta publicación?</legend>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="celular">Número de celular (opcional):</label>
                    <input type="tel" id="celular" name="celular" placeholder="+569.12345678">
                    <span class="error-message"></span>
                </div>
                
                <div class="form-group">
                    <label for="contactar-por">Contactar por (opcional, máx 5):</label>
                    <select id="contactar-por" name="contactar-por" multiple>
                        <option value="whatsapp">Whatsapp</option>
                        <option value="telegram">Telegram</option>
                        <option value="instagram">Instagram</option>
                        <option value="tiktok">Tiktok</option>
                        <option value="x">X (Twitter)</option>
                        <option value="otra">Otra</option>
                    </select>
                    <span class="error-message"></span>
                    <label for="contactar-por-id" style="margin-top: 10px;">ID o URL del medio de contacto:</label>
                    <input type="text" id="contactar-por-id" name="contactar-por-id" placeholder="Ej: @miusuario o tu URL">
                    <span class="error-message"></span>
                </div>
            </fieldset>

            <!-- SECCIÓN 3: MASCOTA -->
            <fieldset>
                <legend>¿Qué mascota ofrece en adopción?</legend>

                <div class="form-group">
                    <label for="tipo-mascota">Tipo:</label>
                    <select id="tipo-mascota" name="tipo-mascota">
                        <option value="">-- Gato o Perro --</option>
                        <option value="gato">Gato</option>
                        <option value="perro">Perro</option>
                    </select>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="1">
                     <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="unidad-edad">Unidad de medida (edad):</label>
                    <select id="unidad-edad" name="unidad-edad">
                         <option value="">-- Meses o Años --</option>
                         <option value="meses">Meses</option>
                         <option value="anios">Años</option>
                    </select>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="fecha-entrega">Fecha disponible para entrega:</label>
                    <input type="datetime-local" id="fecha-entrega" name="fecha-entrega">
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción (opcional):</label>
                    <textarea id="descripcion" name="descripcion" rows="5" cols="50"></textarea>
                </div>

                <div class="form-group">
                    <label for="fotos">Fotos (mínimo 1, máximo 5):</label>
                    <div id="fotos-container">
                        <input type="file" name="fotos[]" class="photo-input" accept="image/*">
                    </div>
                    <button type="button" id="add-photo-btn">Agregar otra foto</button>
                    <span class="error-message" id="fotos-error"></span>
                </div>
            </fieldset>
            
            <div id="form-result"></div>
            <button type="submit" id="submit-btn">Agregar este aviso de adopción</button>
        </form>
    </main>

    <footer>
        <p><a href="index.html">Volver a la Portada</a></p>
    </footer>

    <!-- cargamosS los datos de regiones y comunas -->
    <script src="js/region_comuna.js"></script>
    <!-- cargamos el script principal que usará esos datos -->
    <script src="js/main.js"></script>
</body>
</html>
